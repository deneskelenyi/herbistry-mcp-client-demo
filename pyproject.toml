[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herbistry-mcp"
version = "0.1.0"
description = "Stdio adapter for the token-authenticated Herbistry MCP service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp==1.26.0"]

[project.scripts]
herbistry-mcp = "herbistry_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
